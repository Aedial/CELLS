# CELLS Disassembly Configuration
# =================================
#
# Edit this file to change the disassembly behavior of CELLS items.
# Requires a restart of the game to take effect, after modifications.
# /!\ DO NOT MODIFY THIS FILE UNLESS YOU KNOW WHAT YOU ARE DOING /!\
# Any removed entry will DISABLE the disassembly for that item!
#
# Format:
#   "input_item@metadata" = ["output_item@metadata*N", "another_output"]    # original entry
#   "input_item@metadata" = "previous_input@previous_metadata"              # alias of a previous entry
#
# No @metadata means @0. Each entry only matches its exact metadata.
# Use *N after an output to return N copies.
# An alias (output without brackets) reuses the outputs from an earlier entry.
#
# <housing> keeps a Configurable Cell's settings while removing its component and upgrades.
#     ONLY available for Configurable Cells!
# <component> returns the matching tier component or installed configurable component.

